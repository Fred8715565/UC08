<script>

    const links = document.querySelectorAll('nav a');
    const paginaAtual = document.querySelector('nav a.atual');

    links.forEach(function(link) {

        link.addEventListener('mouseenter', function() {

            if (paginaAtual) {
                paginaAtual.style.borderBottom = '2px solid transparent';
            }

        });

        link.addEventListener('mouseleave', function() {

            if (paginaAtual) {
                paginaAtual.style.borderBottom = '2px solid black';
            }

        });

    });
